<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e9f0" />
    <link rel="icon" href="/pwa-192.png" />
    <title>My Native Preparation</title>
    <script>
      // No-flash: paint the right page color before the app code loads.
      // These three colors must equal colors.light.surface / colors.dark.surface / colors.colour.surface in src/core/ui/tokens.ts (a test checks it,
      // and runs this script to see that it paints what the theme engine paints). There is no "follow the device" mode: anything else is light.
      (function () {
        try {
          var mode = localStorage.getItem('np.theme');
          document.documentElement.style.backgroundColor =
            mode === 'dark' ? '#23262e' : mode === 'colour' ? '#f7f2ff' : '#e6e9f0';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
